name: Package Mac.apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag must match VERSION (v$version)."
            exit 1
          fi

      - name: Install build dependencies
        run: brew install cmake openjdk@21 capstone apktool libpng libvpx

      - name: Build and verify ad-hoc release packages
        shell: bash
        run: |
          mkdir -p build
          scripts/package_release.sh 2>&1 | tee build/package-release.log

      - name: Upload release packages
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mac.apk-macos-arm64-${{ github.sha }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Summarize download
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '### Mac.apk release package'
            echo "[Download DMG, app ZIP, checksums and sources]($ARTIFACT_URL)"
            echo
            echo 'Requires Apple Silicon and macOS 26.4 or newer.'
            echo 'Ad-hoc signed; not Developer ID signed or notarized.'
            echo 'The upstream automatic update checker is disabled in this fork build.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packaging log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-log-${{ github.sha }}
          path: build/package-release.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: package
    if: github.repository == 'dizzzan/Mac.apk' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mac.apk-macos-arm64-${{ github.sha }}
          path: release

      - name: Verify downloaded packages
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt

      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Ad-hoc signed build of the dizzzan/Mac.apk fork for **Apple Silicon, macOS 26.4 or newer**.

          Download the `.dmg`, open it, and drag **Mac.apk.app** into Applications. An app ZIP is also available.

          This build is **not notarized**. After the first launch attempt, macOS may require **System Settings → Privacy & Security → Open Anyway**. The upstream automatic update checker is disabled; download updates from this fork's Releases page.

          Packages passed the bundle dependency audit, entitlement and development/distribution parity checks, DMG verification, and a ZIP extraction/signature check. `BUILD.txt` records the source commit and build tools; `SHA256SUMS.txt` verifies all assets. Corresponding LGPL dependency sources are included in `macapk-lgpl-sources.tar.gz`.
          NOTES
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,targetCommitish > existing-release.json; then
            # Resume an interrupted upload only for our draft at this exact commit.
            if ! jq -e --arg sha "$GITHUB_SHA" \
                '.isDraft == true and .targetCommitish == $sha' existing-release.json; then
              echo '::error::Refusing to replace a published release or a draft for another commit.'
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
              --draft --title "Mac.apk $GITHUB_REF_NAME (ad-hoc)" --notes-file release-notes.md
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url --jq .url \
            >> "$GITHUB_STEP_SUMMARY"
